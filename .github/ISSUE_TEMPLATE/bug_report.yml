name: Bug report
description: Something behaves wrongly, crashes, or does not happen at all.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The two things that make a bug fixable here are **your macOS
        version** and **the actual output** of whichever script or action failed.

        Before filing, one quick check that resolves a common false alarm:
        `./run-smoke.sh` fails completely on a **locked screen** — the window server
        refuses to move windows, so every orb-tuck check fails and it looks exactly like a
        broken animation. If that is what you hit, unlock the screen and run it again.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
      placeholder: |
        I pressed ⌥Space expecting the wheel to open at the pointer.
        It opened at the centre of the screen instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered, starting from a freshly launched Chakra.
      placeholder: |
        1. Launch Chakra
        2. Open Settings and set "Open the wheel at" to Pointer
        3. Move the pointer to the top-right of the screen
        4. Press ⌥Space
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version
      description: From  Apple menu → About This Mac. Include the build if you have it.
      placeholder: "26.5.1 (25F80)"
    validations:
      required: true

  - type: dropdown
    id: chip
    attributes:
      label: Mac type
      options:
        - Apple silicon (M-series)
        - Intel
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Chakra version
      description: From the release you downloaded, or the commit you built.
      placeholder: "v1.0, or commit abc1234"
    validations:
      required: true

  - type: dropdown
    id: how-installed
    attributes:
      label: How did you get Chakra?
      options:
        - Downloaded a release zip
        - Built it myself with ./build.sh
        - Other
    validations:
      required: true

  - type: textarea
    id: script-output
    attributes:
      label: Script output, if a script failed
      description: >
        Paste the real output of ./build.sh, ./run-tests.sh or ./run-smoke.sh.
        Do not summarise it — the exact text is what identifies the failure.
      render: shell

  - type: textarea
    id: console
    attributes:
      label: Crash log or Console output, if the app crashed
      description: >
        Console.app → Crash Reports → the newest Chakra entry. The first 30 lines are
        usually enough.
      render: shell

  - type: checkboxes
    id: multi-display
    attributes:
      label: Setup details that often matter
      options:
        - label: I have more than one display connected
        - label: My Dock is hidden or on the left/right edge
        - label: This happened while a full-screen app was open
        - label: This happened after waking from sleep
        - label: I have other window-management or launcher apps running
